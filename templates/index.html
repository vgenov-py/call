<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minicall</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header>
  <h1>Minicall</h1>
  <div class="user-info">Signed in as <strong>{{ username }}</strong> — <a href="{{ url_for('logout') }}">log out</a></div>
</header>

<main>
  <section class="panel">
    <h2>Online users</h2>
    <ul id="user-list"><li class="empty">Loading…</li></ul>
  </section>
  <p id="status" class="status"></p>
</main>

<div id="incoming-modal" class="modal hidden">
  <div class="modal-box">
    <p><strong id="incoming-from"></strong> is calling you</p>
    <button id="accept-btn" class="btn btn-accept">Accept</button>
    <button id="reject-btn" class="btn btn-reject">Reject</button>
  </div>
</div>

<div id="call-controls" class="call-bar hidden">
  <span>On call with <strong id="call-peer"></strong></span>
  <button id="mute-btn" class="btn">Mute</button>
  <button id="hangup-btn" class="btn btn-reject">Hang up</button>
</div>

<!--
  Socket.IO client loaded from CDN for convenience. For a fully offline / zero
  external-dependency setup, download this file once and serve it from
  static/js/socket.io.min.js instead — see README.md.
-->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
